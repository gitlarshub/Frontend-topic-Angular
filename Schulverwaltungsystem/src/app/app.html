<div class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-sky-600 text-sm font-semibold">
          SV
        </div>
        <div>
          <p class="text-sm font-semibold">Schulverwaltung</p>
          <p class="text-xs text-slate-400">Frontend für dein .NET Backend</p>
        </div>
      </div>

      <div class="hidden items-center gap-3 text-xs text-slate-400 sm:flex">
        <span
          class="inline-flex items-center gap-1 rounded-full border border-emerald-500/40 px-2 py-0.5 text-[11px] text-emerald-300">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
          Schuljahr 2024/25
        </span>
        <span class="rounded-full border border-slate-700 px-2 py-0.5">
          {{ title() }}
        </span>
      </div>
    </div>
  </header>

  <div class="mx-auto flex max-w-6xl gap-4 px-4 py-4">
    <aside class="hidden w-48 shrink-0 md:block">
      <nav class="space-y-4 text-sm">
        <div>
          <p class="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">
            Navigation
          </p>
          <ul class="space-y-1">
            <li>
              <a routerLink="/dashboard" routerLinkActive="bg-slate-800 text-slate-50"
                [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center justify-between rounded-md px-2 py-1.5 text-slate-300 hover:bg-slate-800 hover:text-slate-50">
                <span class="flex items-center gap-2">
                  <span class="text-base">🏠</span>
                  Dashboard
                </span>
              </a>
            </li>
            <li>
              <a routerLink="/students" routerLinkActive="bg-slate-800 text-slate-50"
                class="flex items-center justify-between rounded-md px-2 py-1.5 text-slate-300 hover:bg-slate-800 hover:text-slate-50">
                <span class="flex items-center gap-2">
                  <span class="text-base">👨‍🎓</span>
                  Students
                </span>
              </a>
            </li>
            <li>
              <a routerLink="/classrooms" routerLinkActive="bg-slate-800 text-slate-50"
                class="flex items-center justify-between rounded-md px-2 py-1.5 text-slate-300 hover:bg-slate-800 hover:text-slate-50">
                <span class="flex items-center gap-2">
                  <span class="text-base">🏫</span>
                  Classrooms
                </span>
              </a>
            </li>
            <li>
              <a routerLink="/analytics" routerLinkActive="bg-slate-800 text-slate-50"
                class="flex items-center justify-between rounded-md px-2 py-1.5 text-slate-300 hover:bg-slate-800 hover:text-slate-50">
                <span class="flex items-center gap-2">
                  <span class="text-base">📊</span>
                  Analytics
                </span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </aside>

    <main class="flex-1 space-y-4">
      <section class="rounded-lg border border-slate-800 bg-slate-900/50 p-3">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>
